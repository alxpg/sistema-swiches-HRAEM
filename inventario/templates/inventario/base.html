<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Switches HRAEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inventario:dashboard' %}">Switches HRAEM</a>
        
        <!-- Botón hamburguesa para móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Contenido del navbar -->
        <div class="collapse navbar-collapse" id="navbarNav">
            
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'inventario:dashboard' %}">Dashboard</a>
                </li>
                <!-- Mostrar solo a administradores y superusuarios -->
                {% if user.is_superuser or user.groups.all.0.name == 'Administradores' %}
                <li class="nav-item">
                    <a class="nav-link fw-bold text-warning" href="{% url 'inventario:asignar_nodo' %}">➕ Asignar Nodo</a>
                </li>
                {% endif %}
            </ul>
            
            <!-- Buscador alineado a la derecha -->
            <form class="d-flex me-3" action="{% url 'inventario:buscar' %}" method="get">
                <input class="form-control me-2" name="q" placeholder="Buscar nodo..." value="{{ q|default:'' }}">
                <button class="btn btn-outline-light">Buscar</button>
            </form>

            <!-- Info de Usuario y Logout -->
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center text-white mt-2 mt-lg-0">
                <span class="me-3 small">👤 <b>{{ user.username }}</b></span>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-danger">Salir</button>
                </form>
            </div>
            {% endif %}
            
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<!-- Script de Bootstrap (necesario para que el menú funcione) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
