<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Switches HRAEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inventario:dashboard' %}">Switches HRAEM</a>
        <form class="d-flex" action="{% url 'inventario:buscar' %}" method="get">
            <input class="form-control me-2" name="q" placeholder="Buscar nodo, IP, equipo..." value="{{ q|default:'' }}">
            <button class="btn btn-outline-light">Buscar</button>
        </form>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>
